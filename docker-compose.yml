services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getnet-multiagent-api
    ports:
      - "${PORT:-8001}:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-gpt-4o-mini}
      - ROUTER_MODEL=${ROUTER_MODEL:-}
      - SUPPORT_MODEL=${SUPPORT_MODEL:-}
      - KNOWLEDGE_MODEL=${KNOWLEDGE_MODEL:-}
      - ESCALATION_MODEL=${ESCALATION_MODEL:-}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.0}
      - AGENT_MAX_ITERATIONS=${AGENT_MAX_ITERATIONS:-10}
      - VECTOR_DB=chroma
      - CHROMA_PERSIST_DIR=/app/bds/chroma_db
      - CHECKPOINT_DB_PATH=/app/bds/checkpoints.sqlite
      - CONFIG_DB_PATH=/app/bds/config.db
      - RAG_SYNC_DB_PATH=/app/bds/rag_sync.sqlite
      - RAG_SYNC_MODE=${RAG_SYNC_MODE:-simple}
      - RAG_ASYNC_URLS=${RAG_ASYNC_URLS:-https://site.getnet.com.br/get-ajuda/, https://www.getnet.eu/pt/suporte}
      - RAG_SYNC_URLS=${RAG_SYNC_URLS:-https://site.getnet.com.br/blog/}
      - RAG_CRAWLER_MAX_DEPTH=${RAG_CRAWLER_MAX_DEPTH:-2}
      - RAG_CRAWLER_MAX_PAGES=${RAG_CRAWLER_MAX_PAGES:-100}
      - RAG_WEB_SYNC_CRON=${RAG_WEB_SYNC_CRON:-0 3 * * *}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-desafio-get}
    volumes:
      - ./bds:/app/bds
      - ./fonte_de_dados:/app/fonte_de_dados
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: python:3.11-slim
    container_name: getnet-multiagent-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3001:3001"
    command: python -m http.server 3001 --directory /app/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
